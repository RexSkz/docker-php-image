name: Publish Docker image

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker Hub image tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate image tag
        id: tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.ref_name }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Tag '$IMAGE_TAG' is not a valid Docker image tag." >&2
            exit 1
          fi
          echo "value=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: rexskz/docker-php-image:${{ steps.tag.outputs.value }}
